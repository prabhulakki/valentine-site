<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    :root{
      --bg:#f6cfd6;          /* light pink */
      --card:#ffffff;        /* big white box */
      --text:#1d1d1f;
      --muted:#6b6b75;
      --yes:#ff4d7d;         /* pink button */
      --no:#e9e9ef;          /* grey button */
      --shadow: 0 25px 60px rgba(0,0,0,0.12);
      --radius: 20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      padding: 20px;
    }

    .card{
      width:min(760px, 92vw);
      min-height: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 34px 28px 26px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .panel{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap: 14px;
    }

    .top-img{
      width: 110px;
      height: 110px;
      object-fit: contain;
      user-select:none;
      -webkit-user-drag:none;
    }

    h1{
      margin: 0;
      font-size: clamp(22px, 3.5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .hint{
      margin:0;
      font-size: 13px;
      color: var(--muted);
    }

    /* Button area */
    .stage{
      margin-top: 10px;
      width: min(520px, 90%);
      height: 120px;
      position: relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn{
      border: 0;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 800;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
      transition: transform 180ms ease;
      user-select:none;
      touch-action: manipulation;
    }
    .btn:active{ transform: scale(0.98); }

    #yesBtn{
      background: var(--yes);
      color: #fff;
      position:absolute;
      left: 140px;
      top: 44px;
      transform-origin:center;
    }

    #noBtn{
      background: var(--no);
      color: #222;
      position:absolute;
      left: 300px;
      top: 44px;
    }

    .tiny-note{
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Second screen */
    .yay{
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 900;
      margin: 6px 0 0;
    }

    .yay-emoji{
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-top: 2px;
      user-select:none;
      -webkit-user-drag:none;
    }

    .result-img{
      width: min(320px, 85%);
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      object-fit: cover;
      margin-top: 6px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.15);
      display:none; /* optional */
    }

    .backBtn{
      margin-top: 8px;
      background: #f3f3f7;
      color:#111;
      border: 1px solid #ececf2;
      box-shadow:none;
    }

    /* Confetti dots overlay (subtle) */
    canvas#sprinkles{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      border-radius: var(--radius);
      display:none;
    }

    @media (max-width: 420px){
      .card{ padding: 26px 18px 20px; }
      #yesBtn{ left: 92px; }
      #noBtn{ left: 220px; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <canvas id="sprinkles"></canvas>

    <!-- SCREEN 1 -->
    <div class="panel" id="screen1">
      <img class="top-img" id="topImg" src="teddy.png" alt="Cute character" />
      <h1 id="question">Dear Potti, will you be my valentine?</h1>

      <div class="stage" id="stage">
        <button class="btn" id="yesBtn">Yes</button>
        <button class="btn" id="noBtn">No</button>
      </div>

      <p class="tiny-note">“No” seems a bit shy 😈</p>
    </div>

    <!-- SCREEN 2 -->
    <div class="panel" id="screen2" style="display:none;">
      <img class="top-img" id="topImg2" src="teddy.png" alt="Cute character" />
      <h1 id="question2">Dear Potti, will you be my valentine?</h1>
      <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <div class="yay">YAY!</div>
        <img class="yay-emoji" id="yayEmoji" src="yay-emoji.png" alt="Yay emoji" />
      </div>

      <!-- Optional: show a photo/gif after YES (leave blank or delete if you don't want it) -->
      <img class="result-img" id="resultImg" src="" alt="Result image" />

      <button class="btn backBtn" id="backBtn">Back</button>
    </div>
  </div>

<script>
  /**
   * QUICK CUSTOMIZATION (edit these)
   */
  const NAME = "Potti"; // change name here
  const TOP_IMAGE = "teddy.png";
  const YAY_EMOJI_IMAGE = "yay-emoji.png"; // your emoji image
  const OPTIONAL_RESULT_IMAGE = ""; // e.g. "assets/funny.jpg" (leave "" to hide)

  // ---------- Elements ----------
  const stage = document.getElementById('stage');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn  = document.getElementById('noBtn');

  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');

  const q1 = document.getElementById('question');
  const q2 = document.getElementById('question2');

  const topImg = document.getElementById('topImg');
  const topImg2 = document.getElementById('topImg2');
  const yayEmoji = document.getElementById('yayEmoji');
  const resultImg = document.getElementById('resultImg');

  // ---------- Apply customization ----------
  q1.textContent = `${NAME} will you be my valentine?`;
  q2.textContent = `${NAME} will you be my valentine?`;

  topImg.src = TOP_IMAGE;
  topImg2.src = TOP_IMAGE;
  yayEmoji.src = YAY_EMOJI_IMAGE;

  if (OPTIONAL_RESULT_IMAGE && OPTIONAL_RESULT_IMAGE.trim() !== "") {
    resultImg.src = OPTIONAL_RESULT_IMAGE;
    resultImg.style.display = "block";
  }

  // ---------- YES growth ----------
  let yesScale = 1;
  function growYes() {
    yesScale = Math.min(2.4, yesScale + 0.08);
    yesBtn.style.transform = `scale(${yesScale})`;
  }

  // ---------- NO dodge ----------
  function rand(min, max){ return Math.random()*(max-min)+min; }

  function moveNoButton() {
    const stageRect = stage.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();
    const pad = 10;

    const maxX = stageRect.width - noRect.width - pad;
    const maxY = stageRect.height - noRect.height - pad;

    let x = rand(pad, Math.max(pad, maxX));
    let y = rand(pad, Math.max(pad, maxY));

    noBtn.style.left = `${x}px`;
    noBtn.style.top  = `${y}px`;

    noBtn.animate(
      [{transform:'translateY(0px)'},{transform:'translateY(-4px)'},{transform:'translateY(0px)'}],
      {duration:200, easing:'ease-out'}
    );
  }

  noBtn.addEventListener('mouseenter', () => { moveNoButton(); growYes(); });
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); growYes(); }, {passive:false});
  noBtn.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(); growYes(); });

  // ---------- Sprinkles confetti (dots) ----------
  const canvas = document.getElementById('sprinkles');
  const ctx = canvas.getContext('2d');

  function resizeCanvas(){
    const card = document.getElementById('card').getBoundingClientRect();
    canvas.width = Math.floor(card.width * devicePixelRatio);
    canvas.height = Math.floor(card.height * devicePixelRatio);
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }

  function drawSprinkles(){
    const card = document.getElementById('card').getBoundingClientRect();
    ctx.clearRect(0,0,card.width,card.height);

    const dots = 260;
    for(let i=0;i<dots;i++){
      const x = Math.random()*card.width;
      const y = Math.random()*card.height;
      const r = Math.random()*2.2 + 0.6;

      const hue = (x*0.7 + y*0.25) % 360;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${hue}, 85%, 60%, 0.55)`;
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  window.addEventListener('resize', () => { resizeCanvas(); if (canvas.style.display === "block") drawSprinkles(); });

  // ---------- YES click -> Screen 2 ----------
  yesBtn.addEventListener('click', () => {
    screen1.style.display = "none";
    screen2.style.display = "flex";

    // show sprinkles overlay
    canvas.style.display = "block";
    resizeCanvas();
    drawSprinkles();
  });

  // Back button
  document.getElementById('backBtn').addEventListener('click', () => {
    screen2.style.display = "none";
    screen1.style.display = "flex";
    canvas.style.display = "none";
    yesScale = 1;
    yesBtn.style.transform = "scale(1)";
  });
</script>
</body>
</html>
